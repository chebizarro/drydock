# Drydock microservices topology
#
# Default:  docker compose up -d                    → drydock-core + qdrant
# With LSP: docker compose --profile lsp up -d      → + lsp-bridge
# Upgrades: docker compose --profile depupgrade up -d → + dep-runner
#
# LLM inference servers are NOT part of this stack: run llama.cpp, Ollama or
# vLLM on the host or another machine and point the DRYDOCK_*_BASE_URL
# variables at them. See docs/deployment.md and docs/local-models.md.
#
# Every variable in .env is passed to drydock-core (env_file below); the
# explicit environment entries only supply defaults for container paths and
# service names. drydock-core degrades gracefully when Qdrant or the LSP
# bridge are unavailable (development mode only; production requires Qdrant).

services:
  # --- Core review pipeline ---
  drydock-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: drydock:latest
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    # Pass every setting from .env (DRYDOCK_ENV, DRYDOCK_MONITORED_REPOS_AUTHOR,
    # agentic limits, timeouts, ...) into the container. Entries under
    # `environment:` below override values loaded here.
    env_file:
      - path: .env
        required: false
    environment:
      # Tokenizer cache for the agentic review path (downloaded on first use);
      # kept on the data volume so container recreation does not re-download.
      TIKTOKEN_CACHE_DIR: ${TIKTOKEN_CACHE_DIR:-/data/tiktoken-cache}
      # Health, readiness, metrics and dashboard listener (published on host
      # loopback only, see ports below).
      DRYDOCK_HEALTH_ADDR: ${DRYDOCK_HEALTH_ADDR:-:8081}
      # listener | eval | drift-guard. Listed here (not only in .env) so a shell
      # override such as `DRYDOCK_MODE=eval docker compose run ...` reaches the
      # container; `make eval` passes -e DRYDOCK_MODE=eval explicitly.
      DRYDOCK_MODE: ${DRYDOCK_MODE:-listener}
      # Persistence
      DRYDOCK_DATABASE_URL: ${DRYDOCK_DATABASE_URL:-file:/data/drydock.db?_pragma=foreign_keys(1)&_pragma=busy_timeout(5000)}
      DRYDOCK_REPO_CACHE_DIR: ${DRYDOCK_REPO_CACHE_DIR:-/data/repos}
      DRYDOCK_EVAL_DATASET_PATH: ${DRYDOCK_EVAL_DATASET_PATH:-/app/eval/heldout-sample.json}
      DRYDOCK_REPO_CACHE_MAX_COUNT: ${DRYDOCK_REPO_CACHE_MAX_COUNT:-50}
      DRYDOCK_REPO_CACHE_MAX_SIZE_MB: ${DRYDOCK_REPO_CACHE_MAX_SIZE_MB:-10240}
      DRYDOCK_PR_DIFF_MAX_FILES: ${DRYDOCK_PR_DIFF_MAX_FILES:-1000}
      DRYDOCK_PR_DIFF_MAX_BYTES: ${DRYDOCK_PR_DIFF_MAX_BYTES:-10485760}
      DRYDOCK_APPLY_FAILURE_PUBLICATION: ${DRYDOCK_APPLY_FAILURE_PUBLICATION:-notice}
      # Nostr. Empty DRYDOCK_RELAYS uses public defaults in development only;
      # production needs explicit relays (or both READ and WRITE lists).
      DRYDOCK_RELAYS: ${DRYDOCK_RELAYS:-}
      DRYDOCK_READ_RELAYS: ${DRYDOCK_READ_RELAYS:-}
      DRYDOCK_WRITE_RELAYS: ${DRYDOCK_WRITE_RELAYS:-}
      DRYDOCK_LOG_LEVEL: ${DRYDOCK_LOG_LEVEL:-info}
      # Signing: a NIP-46 bunker is used when set, otherwise DRYDOCK_SIGNER_NSEC
      # or DRYDOCK_SIGNER_NSEC_FILE. Production mode refuses to start without a
      # signer; development mode runs listen-only without one.
      DRYDOCK_SIGNER_BUNKER_URL: ${DRYDOCK_SIGNER_BUNKER_URL:-}
      DRYDOCK_SIGNER_CLIENT_KEY_FILE: ${DRYDOCK_SIGNER_CLIENT_KEY_FILE:-/data/signet-client.key}
      DRYDOCK_SIGNER_NSEC: ${DRYDOCK_SIGNER_NSEC:-}
      DRYDOCK_PROFILE_ENABLED: ${DRYDOCK_PROFILE_ENABLED:-true}
      # LLM endpoints. Empty values fall back to drydock's own development
      # defaults (which point at the container's loopback, so set these in .env)
      # and are rejected in production; see docs/local-models.md.
      DRYDOCK_LLM_API_KEY: ${DRYDOCK_LLM_API_KEY:-}
      DRYDOCK_PLANNER_BASE_URL: ${DRYDOCK_PLANNER_BASE_URL:-}
      DRYDOCK_PLANNER_MODEL: ${DRYDOCK_PLANNER_MODEL:-}
      DRYDOCK_CODER32B_BASE_URL: ${DRYDOCK_CODER32B_BASE_URL:-}
      DRYDOCK_CODER32B_MODEL: ${DRYDOCK_CODER32B_MODEL:-}
      DRYDOCK_LLM70B_BASE_URL: ${DRYDOCK_LLM70B_BASE_URL:-}
      DRYDOCK_LLM70B_MODEL: ${DRYDOCK_LLM70B_MODEL:-}
      DRYDOCK_CODER14B_BASE_URL: ${DRYDOCK_CODER14B_BASE_URL:-}
      DRYDOCK_CODER14B_MODEL: ${DRYDOCK_CODER14B_MODEL:-}
      DRYDOCK_META_BASE_URL: ${DRYDOCK_META_BASE_URL:-}
      DRYDOCK_META_MODEL: ${DRYDOCK_META_MODEL:-}
      DRYDOCK_META_API_KEY: ${DRYDOCK_META_API_KEY:-}
      DRYDOCK_META_MAX_INPUT_BYTES: ${DRYDOCK_META_MAX_INPUT_BYTES:-131072}
      # Qdrant vector store (service name on shared network)
      DRYDOCK_QDRANT_URL: ${DRYDOCK_QDRANT_URL:-http://qdrant:6333}
      DRYDOCK_QDRANT_API_KEY: ${DRYDOCK_QDRANT_API_KEY:-}
      # Embedding model
      DRYDOCK_EMBED_BASE_URL: ${DRYDOCK_EMBED_BASE_URL:-}
      DRYDOCK_EMBED_MODEL: ${DRYDOCK_EMBED_MODEL:-}
      DRYDOCK_EMBED_API_KEY: ${DRYDOCK_EMBED_API_KEY:-}
      # LSP bridge (service name on shared network). The bridge rejects
      # unauthenticated /analyze calls, so core needs the same token.
      DRYDOCK_LSP_BRIDGE_URL: ${DRYDOCK_LSP_BRIDGE_URL:-http://lsp-bridge:8082}
      DRYDOCK_LSP_BRIDGE_TOKEN: ${LSP_BRIDGE_AUTH_TOKEN:-}
      # Dependency-upgrade runner sidecar (service name on shared network). The
      # runner rejects unauthenticated /update calls, so core needs the same token.
      DRYDOCK_DEP_RUNNER_URL: ${DRYDOCK_DEP_RUNNER_URL:-http://dep-runner:8083}
      DRYDOCK_DEP_RUNNER_TOKEN: ${DEP_RUNNER_AUTH_TOKEN:-}
    volumes:
      - drydock_data:/data
      - ./eval:/app/eval:ro
    ports:
      # /healthz, /readyz, /metrics and the dashboard. Bound to host loopback:
      # the dashboard is unauthenticated unless DRYDOCK_DASHBOARD_BEARER_TOKEN
      # is set.
      - "127.0.0.1:${DRYDOCK_HEALTH_HOST_PORT:-8081}:8081"
    networks:
      - drydock_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Qdrant vector database ---
  qdrant:
    image: qdrant/qdrant:v1.12.6
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    # Host loopback only: this Qdrant has no API key unless you configure one
    # (QDRANT__SERVICE__API_KEY), and drydock-core reaches it over drydock_net.
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"  # REST API
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"  # gRPC (unused by drydock, exposed for debugging)
    healthcheck:
      # qdrant:1.12 image has no wget/curl; bash /dev/tcp probe instead
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333; printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3; read -r line <&3; case \"$$line\" in *200*) exit 0;; *) exit 1;; esac'"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - drydock_net

  # --- LSP bridge (optional — activate with: docker compose --profile lsp up) ---
  lsp-bridge:
    build:
      context: .
      dockerfile: docker/lsp-bridge/Dockerfile
    image: drydock-lsp-bridge:latest
    restart: unless-stopped
    profiles:
      - lsp
    environment:
      LSP_BRIDGE_AUTH_TOKEN: ${LSP_BRIDGE_AUTH_TOKEN:?Set LSP_BRIDGE_AUTH_TOKEN in .env before starting the LSP bridge}
    volumes:
      - drydock_data:/data:ro  # read-only access to repo cache
    ports:
      - "${LSP_BRIDGE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 30s  # language servers need time to initialize
      retries: 3
    networks:
      - drydock_net

  # --- Dependency-upgrade runner (optional — activate with:
  #     docker compose --profile depupgrade up) ---
  #
  # Runs go/npm/cargo/pip against UNTRUSTED repository manifests. It never mounts
  # the repo cache: manifests arrive over HTTP, edits are returned over HTTP, and
  # the whole job runs in a per-request temp root inside this disposable, network-
  # and privilege-constrained container.
  dep-runner:
    build:
      context: .
      dockerfile: docker/dep-runner/Dockerfile
    image: drydock-dep-runner:latest
    restart: unless-stopped
    profiles:
      - depupgrade
    environment:
      DEP_RUNNER_AUTH_TOKEN: ${DEP_RUNNER_AUTH_TOKEN:?Set DEP_RUNNER_AUTH_TOKEN in .env before starting the dep-runner}
      # Lifecycle scripts (npm postinstall, cargo build.rs, pip setup.py) execute
      # attacker-controlled code. Opt in ONLY for a trusted, network-isolated
      # deployment that needs lockfiles those scripts produce. Default off.
      DEP_RUNNER_ALLOW_SCRIPTS: ${DEP_RUNNER_ALLOW_SCRIPTS:-false}
      # Operator-pinnable registries. Package *installation* must fetch tarballs,
      # so this container needs egress to exactly these hosts and nothing else —
      # enforce that at the network layer (firewall/NetworkPolicy).
      DEP_RUNNER_GOPROXY: ${DEP_RUNNER_GOPROXY:-https://proxy.golang.org,direct}
      DEP_RUNNER_NPM_REGISTRY: ${DEP_RUNNER_NPM_REGISTRY:-https://registry.npmjs.org}
      DEP_RUNNER_PIP_INDEX_URL: ${DEP_RUNNER_PIP_INDEX_URL:-https://pypi.org/simple}
      DEP_RUNNER_TIMEOUT: ${DEP_RUNNER_TIMEOUT:-4m}
    read_only: true
    tmpfs:
      - /work:size=${DEP_RUNNER_WORK_TMPFS:-2g},mode=1777
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: ${DEP_RUNNER_MEM_LIMIT:-2g}
    cpus: ${DEP_RUNNER_CPUS:-2.0}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - drydock_net

volumes:
  drydock_data:
  qdrant_storage:

networks:
  drydock_net:
    driver: bridge
